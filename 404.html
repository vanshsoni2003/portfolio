<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // GitHub Pages refresh fix
    (function() {
      var repo = "/portfolio"; // 👈 tumhara repo ka naam
      var path = window.location.pathname;
      var newUrl = repo + "/index.html#" + path.replace(repo, "");
      window.location.replace(newUrl);
    })();
  </script>
</head>
<body>
</body>
</html>
